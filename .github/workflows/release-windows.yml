name: Release Windows app

# Runs when you push a version tag, like v1.2.0
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Builds the installer and the Microsoft Store package together
      - run: npm run make
        env:
          PORTPLAY_STORE: '1'

      # The installer goes on the public GitHub release
      # Pinned to an exact commit, since this step can write to the repo
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: out/make/squirrel.windows/x64/PortPlaySetup.exe

      # The Store package is saved on this workflow run, ready to upload to Partner Center
      - uses: actions/upload-artifact@v6
        with:
          name: PortPlay-Store-Package
          path: out/make/msix/x64/*.msix
          if-no-files-found: error
